<div class="widget widget-type-{{ .GetType }}{{ if .HideTitle }} widget-hide-title{{ end }}">
    <div class="widget-header">
        <div class="uppercase">{{ .Title }}</div>
        {{ if and .Error .ContentAvailable }}
        <div class="notice-icon notice-icon-major" title="{{ .Error }}"></div>
        {{ else if .Notice }}
        <div class="notice-icon notice-icon-minor" title="{{ .Notice }}"></div>
        {{ end }}
    </div>
    <div class="widget-content {{ if .ContentAvailable }}{{ block "widget-content-classes" . }}{{ end }}{{ end }}">
        {{ if .ContentAvailable }}
            {{ block "widget-content" . }}{{ end }}
        {{ else }}
        {{ if .Error }}
            <div class="widget-error-header" role="alert" aria-live="assertive">
                <div class="color-negative size-h3">Widget Error</div>
                <div class="widget-error-icon"></div>
            </div>
            <pre class="break-all" style="font-size:0.85em; opacity:0.7; margin-top:5px; white-space: pre-wrap; word-wrap: break-word;">{{ .Error }}</pre>
        {{ else }}
                <style>
                    @keyframes widget-spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
                <div class="widget-loading-container" style="text-align: center; padding: 30px 10px; opacity: 0.6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
                    <div class="loading-spinner" style="border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--color-primary); border-radius: 50%; width: 24px; height: 24px; animation: widget-spin 0.8s linear infinite;"></div>
                    <div style="font-size: 0.85em; letter-spacing: 0.5px;">Loading widget...</div>
                </div>
            {{ end }}
        {{ end}}
    </div>
</div>
